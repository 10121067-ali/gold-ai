name: Update news calendar
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch calendar
        run: |
          curl -fsSL -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o news.tmp
          python3 -c "import json; json.load(open('news.tmp'))" && mv news.tmp news.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news" && git push
